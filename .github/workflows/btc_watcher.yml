name: BTC Piyasa Gozlemcisi

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı (Örn: 13:00, 14:00) çalışır
  workflow_dispatch: # Manuel çalıştırma butonu

jobs:
  analyze-btc:
    runs-on: ubuntu-latest
    
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: BTC Analizini Calistir
        env:
          BTC_BOT_TOKEN: ${{ secrets.BTC_BOT_TOKEN }}
          BTC_CHAT_ID: ${{ secrets.BTC_CHAT_ID }}
        run: python btc_bot.py
